<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KlasAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: zijbalk met gesprekken + hoofdvlak; elk AI-doel heeft een eigen pastelkleur die het hoofdvlak inkleurt. Altijd licht en luchtig. */
:root {
  --bg: #F9FAFE;
  --surface: #FFFFFF;
  --surface-2: #F2F4FA;
  --ink: #1F2737;
  --muted: #6C7588;
  --line: #E5E8F0;
  --primary: #5B7CFA;
  --primary-hover: #4C6DF0;
  --danger: #E0533F;
  --focus: #5B7CFA;
  --codebg: #F6F8FD;
  --codefg: #1F2737;

  --chat: #5B7CFA;  --chat-soft: #EEF2FF;  --chat-ink: #3D5BD9;  --chat-on: #FFFFFF;
  --image: #FF7E6B; --image-soft: #FFF1ED; --image-ink: #D4553F; --image-on: #FFFFFF;
  --music: #FFC447; --music-soft: #FFF8E3; --music-ink: #9A6800; --music-on: #4A3300;
  --code: #2DBA8B;  --code-soft: #E7F8F1;  --code-ink: #15835F;  --code-on: #FFFFFF;

  --font-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --mode: var(--chat); --mode-soft: var(--chat-soft); --mode-ink: var(--chat-ink); --mode-on: var(--chat-on);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: radial-gradient(900px 600px at 100% 0%, var(--chat-soft), transparent 60%), radial-gradient(700px 500px at 0% 100%, var(--code-soft), transparent 60%), var(--bg); background-attachment: fixed; color: var(--ink); font: 400 15px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
#app { height: 100%; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; }
svg { flex: none; }
[hidden] { display: none !important; }

/* ---------- Gedeelde onderdelen ---------- */
.logo { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -0.035em; line-height: 1; }
.logo span { background: linear-gradient(90deg, var(--chat), var(--image) 40%, var(--music) 65%, var(--code)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.eyebrow { margin: 0; font-size: 12.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px solid transparent; border-radius: 12px; padding: 10px 16px; font-weight: 600; line-height: 1.2; transition: background .15s, border-color .15s, transform .1s; }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--primary); color: #FFFFFF; box-shadow: 0 6px 16px -8px var(--primary); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-danger { background: var(--danger); color: var(--surface); }
.btn-sm { padding: 7px 12px; font-size: 13.5px; border-radius: 10px; }
.btn-block { width: 100%; }
.iconbtn { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; border: 0; background: transparent; color: var(--muted); }
.iconbtn:hover { background: var(--surface); color: var(--ink); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; font-size: 13.5px; }
.field .hint { font-size: 12.5px; color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.input { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 14px; outline: none; transition: border-color .15s; }
.input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--chat-soft); }
.input::placeholder { color: var(--muted); opacity: .8; }
.error { margin: 0; color: var(--danger); font-size: 13.5px; font-weight: 500; }
.pill { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.admin { background: var(--chat-soft); color: var(--chat-ink); }
.pill.warn { background: var(--music-soft); color: var(--music-ink); }
.pill.ok { background: var(--code-soft); color: var(--code-ink); }

/* ---------- Inloggen ---------- */
.auth { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
.auth-brand { background: linear-gradient(160deg, var(--chat-soft), var(--image-soft) 55%, var(--music-soft)); padding: 44px clamp(24px, 5vw, 64px); display: flex; flex-direction: column; justify-content: space-between; gap: 40px; }
.auth-brand .logo { font-size: 30px; }
.pitch { display: flex; flex-direction: column; gap: 14px; max-width: 34ch; }
.pitch h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(34px, 4.6vw, 56px); line-height: 1; letter-spacing: -0.035em; }
.pitch p { margin: 0; font-size: 17px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { background: rgb(255 255 255 / .75); border: 1px solid rgb(255 255 255 / .9); box-shadow: 0 8px 24px -16px rgb(31 39 55 / .25); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 26px; }
.tile .ic { width: 42px; height: 42px; border-radius: 13px; background: var(--mode); color: var(--mode-on); display: grid; place-items: center; }
.tile b { display: block; font-family: var(--font-display); font-size: 19px; letter-spacing: -0.02em; }
.tile span { font-size: 13.5px; color: var(--mode-ink); font-weight: 500; }
.auth-main { display: grid; place-items: center; padding: 44px 24px; }
.auth-card { width: 100%; max-width: 410px; display: flex; flex-direction: column; gap: 22px; }
.auth-card h2 { margin: 0; font-family: var(--font-display); font-size: 30px; letter-spacing: -0.03em; line-height: 1.1; }
.auth-card form { display: flex; flex-direction: column; gap: 14px; }
.tabs { display: flex; background: var(--surface-2); border-radius: 999px; padding: 4px; }
.tab { flex: 1; border: 0; background: transparent; padding: 9px 12px; border-radius: 999px; font-weight: 600; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .1); }
.small { font-size: 13.5px; color: var(--muted); margin: 0; }
.demo { border: 1.5px dashed var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 13.5px; color: var(--muted); }
.demo b { color: var(--ink); }
.demo code { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink); }
.demo .acts { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- App-schil ---------- */
.shell { height: 100%; display: grid; grid-template-columns: 276px minmax(0, 1fr); }
.sidebar { background: rgb(255 255 255 / .8); backdrop-filter: blur(8px); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; padding: 18px 14px; min-height: 0; }
.side-top { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 6px; }
.chatlist { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; min-height: 0; margin: 0 -4px; padding: 0 4px; }
.side-label { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 10px 6px; }
.side-empty { font-size: 13.5px; color: var(--muted); padding: 4px 10px; margin: 0; }
.chatlink, .navlink { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; border-radius: 10px; background: transparent; text-align: left; color: var(--ink); }
.chatlink:hover, .navlink:hover { background: var(--surface-2); }
.chatlink.active, .navlink.active { background: var(--chat-soft); color: var(--chat-ink); font-weight: 600; }
.chatlink .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mode); flex: none; }
.chatlink .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; font-size: 14px; }
.navlink { font-weight: 600; font-size: 14px; }
.usercard { display: flex; align-items: center; gap: 10px; padding: 10px 6px 0; border-top: 1px solid var(--line); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--chat-soft); color: var(--chat-ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.who { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.who b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who span { font-size: 12.5px; color: var(--muted); }
.scrim { display: none; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { background: rgb(255 255 255 / .6); backdrop-filter: blur(8px); display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--line); min-height: 62px; }
.menu-btn { display: none; }
.top-title { font-weight: 700; font-size: 15px; }
.modechip { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
.modechip .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--mode); color: var(--mode-on); display: grid; place-items: center; }
.modechip b { font-size: 15px; }
.modechip .sub { color: var(--muted); font-size: 14px; }
.model { margin-left: auto; font: 500 12px var(--font-mono); color: var(--mode-ink); background: var(--mode-soft); padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
.scroll { flex: 1; overflow-y: auto; min-height: 0; }

/* ---------- Doel kiezen ---------- */
.picker { max-width: 880px; margin: 0 auto; padding: clamp(32px, 7vh, 72px) 24px 48px; display: flex; flex-direction: column; gap: 28px; }
.picker h1 { margin: 6px 0 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(32px, 4.6vw, 48px); line-height: 1.02; letter-spacing: -0.035em; max-width: 18ch; }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.card { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 22px; padding: 20px; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 16px; row-gap: 4px; transition: transform .15s, border-color .15s, box-shadow .15s; }
.card { box-shadow: 0 6px 20px -14px rgb(31 39 55 / .2); }
.card:hover { transform: translateY(-3px); border-color: var(--mode); box-shadow: 0 18px 34px -18px var(--mode); }
.card .ic { grid-row: span 2; width: 54px; height: 54px; border-radius: 16px; background: var(--mode-soft); color: var(--mode-ink); display: grid; place-items: center; transition: background .15s, color .15s; }
.card:hover .ic { background: var(--mode); color: var(--mode-on); }
.card h3 { margin: 2px 0 0; font-family: var(--font-display); font-size: 21px; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.card h3 small { font: 500 11.5px var(--font-mono); color: var(--muted); letter-spacing: 0; }
.card p { margin: 0; color: var(--muted); font-size: 14.5px; }
.privacy { display: flex; gap: 10px; align-items: flex-start; margin: 0; font-size: 13.5px; color: var(--muted); max-width: 62ch; }

/* ---------- Gesprek ---------- */
.thread { max-width: 780px; margin: 0 auto; padding: 32px 24px 24px; display: flex; flex-direction: column; gap: 26px; }
.empty { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding-top: clamp(8px, 6vh, 56px); }
.empty .ic { width: 60px; height: 60px; border-radius: 18px; background: var(--mode); color: var(--mode-on); display: grid; place-items: center; }
.empty h2 { margin: 8px 0 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 4vw, 38px); letter-spacing: -0.03em; line-height: 1.05; }
.empty p { margin: 0; color: var(--muted); font-size: 16px; max-width: 52ch; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 14px; font-size: 14px; text-align: left; transition: border-color .15s, background .15s; }
.chip:hover { border-color: var(--mode); background: var(--mode-soft); }

.msg { display: flex; gap: 12px; }
.msg.user { justify-content: flex-end; }
.bubble { background: var(--mode-soft); padding: 10px 16px; border-radius: 20px 20px 6px 20px; max-width: min(80%, 560px); white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.ai .av { width: 32px; height: 32px; border-radius: 10px; background: var(--mode); color: var(--mode-on); display: grid; place-items: center; flex: none; margin-top: 1px; }
.msg.ai .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding-top: 4px; }
.txt { overflow-wrap: anywhere; }
.txt p { margin: 0 0 .7em; }
.txt p:last-child, .txt ul:last-child { margin-bottom: 0; }
.txt ul { margin: 0 0 .7em; padding-left: 1.25em; }
.txt li { margin: .15em 0; }
.txt code { font-family: var(--font-mono); font-size: .88em; background: var(--surface-2); padding: 1px 6px; border-radius: 6px; }
.note { margin: 0; font-size: 12.5px; color: var(--muted); }
.txt.fout { color: var(--danger); }
.dots { display: flex; gap: 5px; align-items: center; height: 32px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--mode); animation: blink 1.1s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
.dots span { margin-left: 8px; font-size: 13.5px; color: var(--muted); }
@keyframes blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

.art { display: block; width: 100%; max-width: 420px; aspect-ratio: 1; height: auto; border-radius: 18px; background: var(--surface-2); }
.player { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 16px 12px 12px; max-width: 480px; }
.play { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--mode); color: var(--mode-on); display: grid; place-items: center; flex: none; }
.wave { flex: 1; min-width: 0; height: 40px; display: flex; align-items: center; gap: 2px; }
.wave i { flex: 1; min-width: 2px; border-radius: 2px; background: var(--line); transition: background .1s; }
.wave i.on { background: var(--mode); }
.time { font: 500 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.codeblock { background: var(--codebg); color: var(--codefg); border-radius: 16px; overflow: hidden; border: 1px solid var(--line); }
.codehead { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px 8px 16px; font: 500 12px var(--font-mono); color: var(--muted); border-bottom: 1px solid var(--line); background: var(--surface); }
.codehead button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; color: var(--muted); padding: 5px 8px; border-radius: 8px; font: 500 12px var(--font-body); }
.codehead button:hover { background: var(--surface-2); color: var(--ink); }
.codeblock pre { margin: 0; padding: 16px; overflow-x: auto; font: 400 13.5px/1.6 var(--font-mono); }
.tk-c { color: #8B94A7; font-style: italic; }
.tk-s { color: #C2570C; }
.tk-k { color: #3D5BD9; }
.tk-t { color: #15835F; }

/* Chatbalk */
.composer-wrap { padding: 4px 24px 18px; }
.composer { position: relative; max-width: 780px; margin: 0 auto; background: var(--surface); border: 1.5px solid var(--line); border-radius: 26px; padding: 8px; display: flex; align-items: flex-end; gap: 8px; box-shadow: 0 12px 36px -18px rgb(61 91 217 / .35); transition: border-color .15s; }
.composer:focus-within { border-color: var(--mode); }
.composer textarea { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; resize: none; padding: 9px 4px; max-height: 200px; line-height: 1.5; }
.composer textarea:focus-visible { outline: none; }
.composer textarea::placeholder { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.send { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--mode); color: var(--mode-on); display: grid; place-items: center; flex: none; transition: opacity .15s, transform .1s; }
.send:disabled { opacity: .3; cursor: default; }
.send:not(:disabled):active { transform: scale(.94); }
.modeswitch { position: relative; flex: none; }
.modepill { height: 40px; display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--mode-soft); color: var(--mode-ink); padding: 0 10px 0 12px; border-radius: 999px; font-weight: 600; font-size: 14px; }
.menu { position: absolute; bottom: calc(100% + 10px); left: 0; width: min(300px, 80vw); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 6px; box-shadow: 0 18px 40px -16px rgb(0 0 0 / .35); z-index: 10; display: flex; flex-direction: column; gap: 2px; }
.menu-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px; border: 0; border-radius: 12px; background: transparent; text-align: left; }
.menu-item:hover, .menu-item[aria-checked="true"] { background: var(--surface-2); }
.menu-item .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--mode); color: var(--mode-on); display: grid; place-items: center; }
.menu-item b { display: block; font-size: 14px; }
.menu-item > span > span { font: 500 11.5px var(--font-mono); color: var(--muted); }
.fineprint { max-width: 780px; margin: 8px auto 0; text-align: center; font-size: 12px; color: var(--muted); }

/* ---------- Beheer ---------- */
.admin { max-width: 1000px; margin: 0 auto; padding: 40px 24px 56px; display: flex; flex-direction: column; gap: 22px; }
.admin h1 { margin: 6px 0 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 4vw, 42px); letter-spacing: -0.035em; line-height: 1.05; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 20px; flex-wrap: wrap; }
.panel-head h2 { margin: 0; font-size: 17px; }
.panel-head p { margin: 2px 0 0; font-size: 13.5px; color: var(--muted); max-width: 60ch; }
.search { max-width: 260px; padding: 9px 12px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 680px; font-size: 14px; }
th { text-align: left; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 10px 20px; border-top: 1px solid var(--line); background: var(--surface-2); }
td { padding: 12px 20px; border-top: 1px solid var(--line); vertical-align: middle; }
td.r, th.r { text-align: right; }
td .acts { display: inline-flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.mono { font-family: var(--font-mono); font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
tr.editrow td { background: var(--chat-soft); }
.pwform { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.pwform .field { flex: 1 1 220px; }
.pwform .input { padding: 9px 12px; font-family: var(--font-mono); font-size: 14px; }
.pwform .error, .pwform .small { flex-basis: 100%; }
.switch { position: relative; width: 48px; height: 28px; border-radius: 999px; border: 0; background: var(--line); flex: none; transition: background .15s; }
.switch span { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgb(0 0 0 / .25); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--code); }
.switch[aria-checked="true"] span { transform: translateX(20px); }
.models { list-style: none; margin: 0; padding: 0; }
.models li { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.models .ic { width: 36px; height: 36px; border-radius: 11px; background: var(--mode-soft); color: var(--mode-ink); display: grid; place-items: center; }
.models .nm { flex: 1; min-width: 160px; }
.models .nm b { display: block; font-size: 14.5px; }
.models .nm span { font: 500 12px var(--font-mono); color: var(--muted); }

/* ---------- Melding ---------- */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px); background: var(--ink); color: #FFFFFF; padding: 11px 18px; border-radius: 14px; font-weight: 500; font-size: 14px; box-shadow: 0 14px 30px -12px rgb(0 0 0 / .4); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Smal scherm ---------- */
@media (max-width: 900px) {
  .auth { grid-template-columns: minmax(0, 1fr); }
  .auth-brand { gap: 28px; padding-block: 32px; }
  .pitch h1 { font-size: 34px; }
}
@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); }

function fmt(t) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>');
  return String(t).split(/\n{2,}/).map(block => {
    let out = '', para = [], list = [];

      if (para.length) out += '<p>' + para.map(inline).join('<br>') + '</p>';
      if (list.length) out += '<ul>' + list.map(l => `<li>${inline(l)}</li>`).join('') + '</ul>';

/* ================= Ollama (via de KlasAI-server) ================= */
const API = { ok: false, status: null };
async function checkOllama() {
  try {
    const r = await fetch('api/status', { cache: 'no-store', signal: AbortSignal.timeout ? AbortSignal.timeout(5000) : undefined });
    if (!r.ok) throw new Error('geen server');
    const j = await r.json();
    API.status = j;
    API.ok = !!(j.ollama && j.modelAanwezig);
    if (j.model) MODES.chat.model = j.model;
  } catch (e) { API.ok = false; API.status = null; }
}
function ollamaUitleg() {
  const st = API.status;
  if (!st) return 'Je gebruikt KlasAI zonder server, dus je krijgt voorbeeldantwoorden. Start KlasAI met "npm start" om met Ollama te chatten.';
  if (!st.ollama) return 'Ollama is niet bereikbaar, dus je krijgt voorbeeldantwoorden. Start Ollama op de server.';
  return `Het model ${st.model} is nog niet geïnstalleerd, dus je krijgt voorbeeldantwoorden. Voer op de server uit: ollama pull ${st.model}`;
}
function modelPill(k) {
  if (k !== 'chat') return '<span class="pill warn">Nagebootst in prototype</span>';
  if (API.ok) return '<span class="pill ok">Verbonden met Ollama</span>';
  if (API.status && API.status.ollama) return '<span class="pill warn">Model niet geïnstalleerd</span>';
  if (API.status) return '<span class="pill warn">Ollama niet bereikbaar</span>';
  return '<span class="pill warn">Nagebootst, geen server</span>';
}
async function streamChat(chat) {
  const history = chat.berichten.filter(x => !x.fout && (x.rol === 'user' || x.type === 'text'))
    .slice(-20).map(x => ({ role: x.rol === 'user' ? 'user' : 'assistant', content: x.tekst }));
  const m = { id: uid(), rol: 'ai', type: 'text', tekst: '' };
  const viewing = () => state.view === 'chat' && state.chatId === chat.id;
  let started = false, queued = false;
  const start = () => { started = true; chat.berichten.push(m); state.thinkingChat = null; if (viewing()) renderThread(); };
  const paint = () => {
    queued = false;
    if (!viewing()) return;
    const el = qs(`[data-mid="${m.id}"] .txt`);
    if (el) { el.innerHTML = fmt(m.tekst); scrollDown(); }
  };
  try {
    const r = await fetch('api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: history }) });
    if (!r.ok) {
      let msg = `De server gaf een fout (${r.status}).`;
      try { const j = await r.json(); if (j.fout) msg = j.fout; } catch (e) {}
      throw new Error(msg);
    }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line) continue;
        const j = JSON.parse(line);
        if (j.error) throw new Error(j.error);
        const piece = (j.message && j.message.content) || '';
        if (!piece) continue;
        m.tekst += piece;
        if (!started) start();
        else if (!queued) { queued = true; requestAnimationFrame(paint); }
      }
    }
    if (!started) { m.tekst = 'Het model gaf geen antwoord. Probeer je vraag nog eens.'; m.fout = true; start(); }
  } catch (err) {
    const uitleg = (err && err.message) || 'Onbekende fout.';
    if (started) m.tekst += `\n\n(Het antwoord is afgebroken: ${uitleg})`;
    else { m.tekst = `Het taalmodel kon geen antwoord geven. ${uitleg}`; m.fout = true; start(); }
  }
  state.busyChat = null; state.thinkingChat = null;
  chat.bijgewerkt = Date.now();
  save();
  if (viewing()) renderThread(); else updateSend();
}

/* ================= Beeld tekenen (nep-generatie) ================= */
function drawArt(c, seed) {
  const r = rng(seed), x = c.getContext('2d'), W = c.width, H = c.height;
  if (!x) return;
  const h = Math.floor(r() * 360), h2 = Math.floor(h + 40 + r() * 90) % 360;
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `hsl(${h},75%,80%)`);
  g.addColorStop(1, `hsl(${h2},78%,64%)`);
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 46; i++) {
    x.fillStyle = `hsla(0,0%,100%,${(r() * 0.55).toFixed(2)})`;
    x.beginPath(); x.arc(r() * W, r() * H * 0.55, 1 + r() * 3, 0, Math.PI * 2); x.fill();
  }
  const sx = W * (0.25 + r() * 0.5), sy = H * (0.18 + r() * 0.18), sr = W * (0.1 + r() * 0.07);
  x.fillStyle = `hsla(${(h2 + 40) % 360},100%,92%,0.35)`; x.beginPath(); x.arc(sx, sy, sr * 1.6, 0, Math.PI * 2); x.fill();
  x.fillStyle = `hsl(${(h2 + 40) % 360},100%,90%)`; x.beginPath(); x.arc(sx, sy, sr, 0, Math.PI * 2); x.fill();
  for (let l = 0; l < 4; l++) {
    const base = H * (0.5 + l * 0.12), amp = H * (0.03 + r() * 0.06), f = 1 + r() * 2.5, ph = r() * 6.28;
    x.beginPath(); x.moveTo(0, H);
    for (let px = 0; px <= W; px += 6) {
      const t = px / W;
      x.lineTo(px, base + Math.sin(t * f * 6.28 + ph) * amp + Math.sin(t * f * 13 + ph * 2) * amp * 0.28);
    }
    x.lineTo(W, H); x.closePath();
    x.fillStyle = `hsl(${(h2 + l * 14) % 360},${50 + l * 6}%,${50 - l * 11}%)`;
    x.fill();
  }
}

const STEPS = 32;
const trackInfo = m => { const r = rng(m.seed); const bpm = 84 + Math.floor(r() * 40); const step = 60 / bpm / 2; return { r, step, dur: step * STEPS }; };
const waveBars = m => { const r = rng(m.seed + 7); let prev = .5; let out = ''; for (let i = 0; i < 56; i++) { prev = Math.min(1, Math.max(.15, prev + (r() - .5) * .5)); out += `<i style="height:${Math.round(prev * 100)}%"></i>`; } return out; };
const player = { ctx: null, id: null, raf: 0, t0: 0, dur: 0, nodes: [] };

function stopMusic() {
  player.nodes.forEach(n => { try { n.stop(); } catch (e) {} });
  player.nodes = [];
  cancelAnimationFrame(player.raf);
  const old = player.id; player.id = null;
  if (old) updatePlayer(old, 0, false);
}
function updatePlayer(id, frac, playing) {
  const el = qs(`.player[data-id="${id}"]`);
  if (!el) return;
  const bars = qsa('.wave i', el), on = Math.round(frac * bars.length);
  bars.forEach((b, i) => b.classList.toggle('on', i < on));
  const btn = qs('.play', el);
  btn.innerHTML = ic(playing ? 'pause' : 'play', 20);
  btn.setAttribute('aria-label', playing ? 'Pauzeren' : 'Afspelen');
  qs('.time', el).textContent = `${mmss(frac * Number(el.dataset.dur))} / ${mmss(Number(el.dataset.dur))}`;
}
function playMusic(m) {
  if (player.id === m.id) { stopMusic(); return; }
  stopMusic();
  try { player.ctx = player.ctx || new (window.AudioContext || window.webkitAudioContext)(); }
  catch (e) { toast('Afspelen lukt niet in deze browser.'); return; }
  const ctx = player.ctx;
  if (ctx.state === 'suspended') ctx.resume();
  const { r, step, dur } = trackInfo(m);
  const root = 220 * Math.pow(2, Math.floor(r() * 5) / 12);
  const scale = m.mineur ? [0, 2, 3, 5, 7, 8, 10, 12] : [0, 2, 4, 5, 7, 9, 11, 12];
  const prog = m.mineur ? [0, 5, 3, 4] : [0, 4, 5, 3];
  const master = ctx.createGain(); master.gain.value = 0.16; master.connect(ctx.destination);
  const t0 = ctx.currentTime + 0.06;
  const note = (freq, t, len, type, vol) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + len + 0.05);
    player.nodes.push(o);
  };
  let deg = 2;
  for (let i = 0; i < STEPS; i++) {
    const t = t0 + i * step;
    if (i % 8 === 0) {
      const b = scale[prog[(i / 8) % 4]];
      note(root / 2 * Math.pow(2, b / 12), t, step * 7.6, 'sine', 0.9);
      note(root * Math.pow(2, (b + (m.mineur ? 3 : 4)) / 12), t, step * 7.6, 'sine', 0.18);
    }
    if (r() < 0.2) continue;
    deg = Math.max(0, Math.min(7, deg + Math.floor(r() * 5) - 2));
    note(root * 2 * Math.pow(2, scale[deg] / 12), t, step * 0.95, 'triangle', 0.55);
  }
  player.id = m.id; player.t0 = t0; player.dur = dur;
  const tick = () => {
    const frac = Math.min(1, Math.max(0, (ctx.currentTime - player.t0) / player.dur));
    updatePlayer(m.id, frac, true);
    if (frac >= 1) { stopMusic(); return; }
    player.raf = requestAnimationFrame(tick);
  };
  tick();
}

function msgHTML(m, mode) {
  if (m.rol === 'user') return `<div class="msg user"><div class="bubble">${esc(m.tekst)}</div></div>`;
  let inner = '';
  if (m.type === 'image') {
    inner = `<p class="txt">${esc(m.tekst)}</p><canvas class="art" width="768" height="768" data-seed="${m.seed}" role="img" aria-label="Gegenereerde afbeelding"></canvas><p class="note">Voorbeeldafbeelding. In de echte versie maakt ${MODES.image.model} dit beeld op de server van school.</p>`;
  } else if (m.type === 'music') {
    const d = trackInfo(m).dur;
    inner = `<p class="txt">${esc(m.tekst)}</p><div class="player" data-id="${m.id}" data-dur="${d.toFixed(2)}"><button class="play" data-action="play" data-id="${m.id}" aria-label="Afspelen">${ic('play', 20)}</button><div class="wave">${waveBars(m)}</div><span class="time">0:00 / ${mmss(d)}</span></div><p class="note">Voorbeeldmelodie, gemaakt in je browser. In de echte versie maakt ${MODES.music.model} het nummer.</p>`;
  } else if (m.type === 'code') {
    inner = `<div class="txt">${fmt(m.tekst)}</div><div class="codeblock"><div class="codehead"><span>${esc(m.taal)}</span><button data-action="copy" data-id="${m.id}">${ic('copy', 14)} Kopiëren</button></div><pre><code>${hl(m.code, m.taal)}</code></pre></div><div class="txt">${fmt(m.uitleg)}</div>`;
  } else {
    inner = `<div class="txt${m.fout ? ' fout' : ''}">${fmt(m.tekst)}</div>`;
  }
  return `<div class="msg ai" data-mid="${m.id}"><div class="av">${ic(mode, 18)}</div><div class="body">${inner}</div></div>`;
}

function renderThread() {
  const thread = qs('#thread');
  if (!thread) return;
  const mode = currentMode(), M = MODES[mode], chat = currentChat();
  if (!chat || !chat.berichten.length) {
    thread.innerHTML = `<div class="empty"><div class="ic">${ic(mode, 28)}</div><h2>${M.titel}</h2><p>${M.omschrijving}</p><div class="chips">${M.suggesties.map(s => `<button class="chip" data-action="suggest" data-text="${esc(s)}">${esc(s)}</button>`).join('')}</div>${mode === 'chat' && !API.ok ? `<p class="note">${esc(ollamaUitleg())}</p>` : ''}</div>`;
  } else {
    thread.innerHTML = chat.berichten.map(m => msgHTML(m, mode)).join('') +
      (state.thinkingChat === chat.id ? `<div class="msg ai"><div class="av">${ic(mode, 18)}</div><div class="dots" aria-label="KlasAI denkt na"><i></i><i></i><i></i><span>${mode === 'image' ? 'Afbeelding maken…' : mode === 'music' ? 'Muziek componeren…' : 'Denkt na…'}</span></div></div>` : '');
  }
  qsa('canvas.art', thread).forEach(c => drawArt(c, Number(c.dataset.seed)));
  updateSend();
  scrollDown();
  if (state.animate && chat) {
    const m = chat.berichten.find(x => x.id === state.animate);
    state.animate = null;
    if (m && m.type === 'text' && !reduceMotion()) typeOut(m);
  }
}
function typeOut(m) {
  const el = qs(`[data-mid="${m.id}"] .txt`);
  if (!el) return;
  const full = m.tekst; let i = 0;
  el.style.whiteSpace = 'pre-wrap'; el.textContent = '';
  const tick = () => {
    if (!el.isConnected) return;
    i = Math.min(full.length, i + 4);
    el.textContent = full.slice(0, i).replace(/\*\*/g, '').replace(/`/g, '');
    scrollDown();
    if (i < full.length) setTimeout(tick, 14);
    else { el.style.whiteSpace = ''; el.innerHTML = fmt(full); }
  };
  tick();
}
function scrollDown() { const s = qs('#scroll'); if (s) s.scrollTop = s.scrollHeight; }
function updateSend() {
  const t = qs('#prompt'), b = qs('#send');
  if (t && b) b.disabled = !t.value.trim() || !!state.busyChat;
}
function grow(t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 200) + 'px'; }

function send(text) {
  text = text.trim();
  if (!text || state.busyChat) return;
  const mode = currentMode();
  let chat = currentChat();
  if (!chat) {
    chat = { id: uid(), mode, titel: kort(text), bijgewerkt: Date.now(), berichten: [] };
    myChats().push(chat);
    state.chatId = chat.id; state.pendingMode = null;
  }
  chat.berichten.push({ id: uid(), rol: 'user', tekst: text });
  chat.bijgewerkt = Date.now();
  state.busyChat = chat.id; state.thinkingChat = chat.id;
  save();
  const t = qs('#prompt'); if (t) { t.value = ''; grow(t); }
  renderSidebar(); renderThread();
  if (mode === 'chat' && API.ok) { streamChat(chat); return; }
  const delay = mode === 'image' || mode === 'music' ? 1700 : 900;
  setTimeout(() => {
    const m = Object.assign({ id: uid(), rol: 'ai' }, antwoord(mode, text));
    chat.berichten.push(m); chat.bijgewerkt = Date.now();
    state.busyChat = null; state.thinkingChat = null;
    save();
    if (state.view === 'chat' && state.chatId === chat.id) { state.animate = m.id; renderThread(); }
    else updateSend();
  }, delay);
}

function login(u) {
  state.user = u; store.set('session', u.id);
  state.view = 'chat'; state.chatId = null; state.pendingMode = null; state.editPw = null; state.confirmDel = null;
  renderShell();
}
function render() { state.user ? renderShell() : renderAuth(); }

document.addEventListener('click', e => {
  if (state.menuOpen && !e.target.closest('.modeswitch')) setMenu(false);
  const a = e.target.closest('[data-action]');
  if (!a) return;
  const d = a.dataset;
  switch (d.action) {
    case 'tab': state.authTab = d.tab; renderAuth(); break;
    case 'demo': qs('#login-user').value = d.u; qs('#login-pw').value = d.p; qs('#login-pw').focus(); break;
    case 'open-sidebar': openSidebar(true); break;
    case 'close-sidebar': openSidebar(false); break;
    case 'new-chat': go({ view: 'chat', chatId: null, pendingMode: null }); break;
    case 'open-chat': go({ view: 'chat', chatId: d.id, pendingMode: null }); break;
    case 'admin': go({ view: 'admin', editPw: null, confirmDel: null }); break;
    case 'pick-mode': go({ view: 'chat', chatId: null, pendingMode: d.mode }); qs('#prompt') && qs('#prompt').focus(); break;
    case 'toggle-menu': setMenu(!state.menuOpen); break;
    case 'switch-mode': {
      setMenu(false);
      if (d.mode === currentMode()) break;
      const c = currentChat();
      const draft = (qs('#prompt') || {}).value || '';
      go({ chatId: null, pendingMode: d.mode });
      if (c && c.berichten.length) toast(`Nieuw gesprek gestart met ${MODES[d.mode].naam}`);
      const t = qs('#prompt'); if (t) { t.value = draft; grow(t); updateSend(); t.focus(); }
      break;
    }
    case 'suggest': send(d.text); break;
    case 'play': { const c = currentChat(); const m = c && c.berichten.find(x => x.id === d.id); if (m) playMusic(m); break; }
    case 'copy': {
      const c = currentChat(); const m = c && c.berichten.find(x => x.id === d.id);
      if (!m) break;
      const pre = qs('pre', a.closest('.codeblock'));
      const fallback = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Code geselecteerd. Kopieer met Ctrl+C.'); };
      try { navigator.clipboard.writeText(m.code).then(() => toast('Code gekopieerd'), fallback); } catch (err) { fallback(); }
      break;
    }
    case 'logout': stopMusic(); store.del('session'); state.user = null; state.authTab = 'login'; renderAuth(); break;
    case 'edit-pw': state.editPw = d.id; state.confirmDel = null; renderUsers(); qs('#pw-new') && qs('#pw-new').focus(); break;
    case 'cancel-pw': state.editPw = null; renderUsers(); break;
    case 'gen-pw': { const i = qs('#pw-new'); i.value = bedenkWachtwoord(); i.focus(); break; }
    case 'del': state.confirmDel = d.id; state.editPw = null; renderUsers(); break;
    case 'del-no': state.confirmDel = null; renderUsers(); break;
    case 'del-yes': {
      const u = db.users.find(x => x.id === d.id);
      db.users = db.users.filter(x => x.id !== d.id); delete db.chats[d.id]; save();
      state.confirmDel = null; renderUsers();
      if (u) toast(`Account van ${u.naam} is verwijderd`);
      break;
    }
    case 'toggle-reg': {
      db.settings.zelfRegistreren = !db.settings.zelfRegistreren; save();
      a.setAttribute('aria-checked', String(db.settings.zelfRegistreren));
      toast(db.settings.zelfRegistreren ? 'Leerlingen kunnen nu zelf een account maken' : 'Zelf een account maken staat uit');
      break;
    }
  }
});

document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]');
  if (!f) return;
  e.preventDefault();
  const showErr = (id, msg) => { const el = qs('#' + id); el.textContent = msg; el.hidden = false; };
  if (f.dataset.form === 'login') {
    const un = qs('#login-user').value.trim().toLowerCase(), pw = qs('#login-pw').value;
    if (!un || !pw) return showErr('login-err', 'Vul je gebruikersnaam en wachtwoord in.');
    const u = db.users.find(x => x.gebruikersnaam === un && x.wachtwoord === pw);
    if (!u) return showErr('login-err', 'Die gebruikersnaam of dat wachtwoord klopt niet. Let op hoofdletters.');
    login(u); toast(`Hoi ${voornaam(u)}!`);
  } else if (f.dataset.form === 'register') {
    const naam = qs('#reg-naam').value.trim(), klas = qs('#reg-klas').value.trim().toUpperCase();
    const un = qs('#reg-user').value.trim().toLowerCase(), pw = qs('#reg-pw').value, pw2 = qs('#reg-pw2').value;
    if (!naam || !klas) return showErr('reg-err', 'Vul je naam en je klas in.');
    if (!/^[a-z0-9]{3,20}$/.test(un)) return showErr('reg-err', 'Kies een gebruikersnaam van 3 tot 20 kleine letters of cijfers, zonder spaties.');
    if (db.users.some(x => x.gebruikersnaam === un)) return showErr('reg-err', `De gebruikersnaam "${un}" is al bezet. Probeer een andere.`);
    if (pw.length < 6) return showErr('reg-err', 'Je wachtwoord moet minstens 6 tekens lang zijn.');
    if (pw !== pw2) return showErr('reg-err', 'De twee wachtwoorden zijn niet hetzelfde.');
    const u = { id: 'u-' + uid(), naam, gebruikersnaam: un, klas, wachtwoord: pw, rol: 'leerling', aangemaakt: Date.now() };
    db.users.push(u); save();
    login(u); toast(`Welkom bij KlasAI, ${voornaam(u)}!`);
  } else if (f.dataset.form === 'pw') {
    const pw = qs('#pw-new').value.trim();
    if (pw.length < 6) return showErr('pw-err', 'Een wachtwoord moet minstens 6 tekens lang zijn.');
    const u = db.users.find(x => x.id === f.dataset.id);
    if (!u) return;
    u.wachtwoord = pw; save();
    state.editPw = null; renderUsers();
    toast(`Nieuw wachtwoord voor ${u.naam} is opgeslagen`);
  } else if (f.dataset.form === 'send') {
    send(qs('#prompt').value);
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'prompt') { grow(e.target); updateSend(); }
  if (e.target.id === 'zoek') { state.zoek = e.target.value; renderUsers(); }
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'prompt' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(e.target.value); }
  if (e.key === 'Escape') { if (state.menuOpen) setMenu(false); openSidebar(false); }
});

checkOllama().finally(render);
})();
</script>
</body>
</html>
